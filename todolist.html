<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <h1>My Tasks</h1>
    <p class="subtitle" id="date"></p>

    
    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="What needs doing?" aria-label="New task" maxlength="120" required>
      <button type="submit">Add task</button>
    </form>

   
    <div class="filters" id="filters">
      <button type="button" class="active" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </div>

   
    <ul id="taskList"></ul>
    <p class="empty" id="emptyMsg" hidden>No tasks here. Add one above.</p>

    <div class="footer">
      <span id="counter"></span>
      <button type="button" id="clearDone">Clear completed</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
